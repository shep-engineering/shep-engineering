  <text x="64" y="240" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15.5" fill="#7d8590" letter-spacing="0.2">20+ yrs engineering  //  7+ yrs leading managers  //  Plano, TX</text>
